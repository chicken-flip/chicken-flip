<title>Chicken Flip</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; }
  body { background:#1F1B17; font-family: -apple-system, 'Pretendard', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #splash { position:fixed; inset:0; background:#1F1B17; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; transition: opacity 0.5s ease, visibility 0.5s ease; }
  #splash.hide { opacity:0; visibility:hidden; pointer-events:none; }
  .splashStage { position:relative; width:280px; height:280px; display:flex; align-items:center; justify-content:center; }
  #splash img { width: 180px; opacity:0; animation: charInOut 0.65s ease-out 0.1s forwards; }
  @keyframes charInOut { 0%{ opacity:0; transform:scale(0.85);} 30%{ opacity:1; transform:scale(1);} 40%{ opacity:1; transform:scale(1);} 100%{ opacity:0; transform:scale(1.03);} }
  .splashLogo { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:1; animation: logoWipe 1.8s linear 0.5s both; }
  .splashLogo svg { width:220px; height:auto; }
  @keyframes logoWipe {
    0%   { clip-path: inset(0 100% 0 0); }
    22%  { clip-path: inset(0 0% 0 0); }
    78%  { clip-path: inset(0 0% 0 0); }
    100% { clip-path: inset(0 0% 0 100%); }
  }
  .gameArea { opacity:0; transition: opacity 0.6s ease; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 8px; overflow:hidden; }
  .gameArea.show { opacity:1; }
  .logoWrap { width:100%; max-width:900px; display:flex; justify-content:center; margin-bottom:4px; flex-shrink:0; }
  .logoWrap svg { width: 110px; height: auto; }
  .hint { color:#B8543A; font-size:11px; margin-bottom:8px; text-align:center; flex-shrink:0; }
  .frame { position:relative; border-radius:12px; overflow:hidden; border:2px solid #333; background:#F4F1EC; }
  canvas { display:block; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  #overlay img { width: 54px; opacity:0.9; margin-bottom:2px; }

  /* 가로형(landscape): 로고/힌트 숨기고 화면 꽉 채움 */
  .logoWrap, .hint { display:none; }
  .gameArea { padding:4px; }
  .frame { border-radius:8px; }

  .rotateHint { display:flex; align-items:center; gap:6px; color:#B8543A; font-size:12px; margin-bottom:8px; flex-shrink:0; }
  .rotateHint svg { flex-shrink:0; animation: rotateHintSpin 1.6s ease-in-out infinite; }
  @keyframes rotateHintSpin { 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-90deg);} }

  @media (orientation: landscape) {
    .gameArea { padding:0; }
    .frame { border-radius:0; border:none; }
    .rotateHint { display:none; }
  }
</style>
</head>

<script>
(function(){
try{
  var splash = document.getElementById('splash');
  var gameArea = document.getElementById('gameArea');
  setTimeout(function(){
    splash.classList.add('hide');
    gameArea.classList.add('show');
  }, 2500);
  var frame = document.getElementById('frame');
  var canvas = document.getElementById('gc');
  var ctx = canvas.getContext('2d');

  // 논리 좌표계는 항상 380x170 고정, 실제 픽셀 해상도만 화면 크기·DPR에 맞춰 조정
  var LOGICAL_W = 380, LOGICAL_H = 170;
  var groundY = 132;
  var scaleFactor = 1;

  function resize(){
    var parent = frame.parentElement;
    var availW = parent.clientWidth;
    var availH = parent.clientHeight;
    var aspect = LOGICAL_W / LOGICAL_H;
    var isPortrait = availH > availW;
    var displayWidth = availW;
    var displayHeight = displayWidth / aspect;
    if(displayHeight > availH){
      displayHeight = availH;
      displayWidth = displayHeight * aspect;
    }
    if(isPortrait){
      var boost = 1.3; // 세로형에서 화면 폭보다 살짝 크게 확대 (좌우는 잘림, 장애물 로직엔 영향 없음)
      var preBoostWidth = displayWidth;
      displayWidth *= boost;
      displayHeight *= boost;
      var extra = displayWidth - preBoostWidth;
      frame.style.marginLeft = (extra * 0.62) + 'px'; // 캐릭터가 왼쪽에 있어서 자르는 기준을 오른쪽으로 이동
    } else {
      frame.style.marginLeft = '0px';
    }
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(displayWidth * dpr);
    canvas.height = Math.round(displayHeight * dpr);
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';
    frame.style.width = displayWidth + 'px';
    frame.style.height = displayHeight + 'px';
    scaleFactor = (displayWidth * dpr) / LOGICAL_W;
    ctx.setTransform(scaleFactor, 0, 0, scaleFactor, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });
  if(window.ResizeObserver){ new ResizeObserver(resize).observe(gameArea); }
  resize();

  var spriteRun = new Image();
  var spriteJump = new Image();
  var boardImg = new Image();
  var runReady = false, jumpReady = false, boardReady = false;
  var spriteReady = false;
  function checkBothReady(){
    if(runReady && jumpReady && boardReady && obsReadyCount >= 7){
      spriteReady = true;
      document.getElementById('overlay').innerHTML = '<div style="font-size:20px; font-weight:500; color:#1F1B17; background:rgba(244,241,236,0.85); padding:4px 14px; border-radius:8px;">TAP TO START</div><div style="font-size:13px; color:#6b6560; margin-top:6px; background:rgba(244,241,236,0.85); padding:2px 10px; border-radius:6px;">best ' + best + '</div><div style="font-size:13px; color:#B8543A; margin-top:10px; background:rgba(244,241,236,0.85); padding:2px 10px; border-radius:6px; text-align:center;">TAP: JUMP · TAP AGAIN IN AIR: DOUBLE JUMP</div>';
    }

  // --- Web Audio API 전환: <audio> 태그의 재생 파이프라인 지연 + MP3 인코더 선두 무음을 제거하기 위함 ---
  var audioCtx = null;
  var jumpBuffer = null, deathBuffer = null, bgmBuffer = null;
  var bgmSource = null, bgmGain = null, bgmStarted = false;
  var currentJumpSrc = null, currentDeathSrc = null;

  function trimSilence(buffer, threshold){
    threshold = threshold || 0.035;
    var channels = buffer.numberOfChannels;
    var length = buffer.length;
    var start = 0;
    outer:
    for (var i = 0; i < length; i++){
      for (var c = 0; c < channels; c++){
        if (Math.abs(buffer.getChannelData(c)[i]) > threshold){ start = i; break outer; }
      }
    }
    if (start === 0 || start >= length) return buffer;
    var trimmed = audioCtx.createBuffer(channels, length - start, buffer.sampleRate);
    for (var c = 0; c < channels; c++){
      trimmed.getChannelData(c).set(buffer.getChannelData(c).subarray(start));
    }
    return trimmed;
  }

  function loadBuffer(dataUri, onReady, skipTrim){
    fetch(dataUri).then(function(r){ return r.arrayBuffer(); }).then(function(buf){
      audioCtx.decodeAudioData(buf, function(decoded){ onReady(skipTrim ? decoded : trimSilence(decoded)); }, function(){});
    }).catch(function(){});
  }

  function startBgm(){
    if (bgmStarted || !bgmBuffer || !audioCtx) return;
    bgmStarted = true;
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0.45; // 효과음보다 낮게, 배경음 느낌으로
    bgmGain.connect(audioCtx.destination);
    bgmSource = audioCtx.createBufferSource();
    bgmSource.buffer = bgmBuffer;
    bgmSource.loop = true;
    bgmSource.connect(bgmGain);
    bgmSource.start(0);
  }

  function ensureAudioCtx(){
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    loadBuffer(jumpAudio.src, function(b){ jumpBuffer = b; });
    loadBuffer(deathAudio.src, function(b){ deathBuffer = b; });
    loadBuffer(bgmAudio.src, function(b){ bgmBuffer = b; startBgm(); }, true);
  }

  function stopAllSounds(){
    if (currentJumpSrc) { try{ currentJumpSrc.stop(); }catch(e){} currentJumpSrc = null; }
    if (currentDeathSrc) { try{ currentDeathSrc.stop(); }catch(e){} currentDeathSrc = null; }
    jumpAudio.pause(); jumpAudio.currentTime = 0;
    deathAudio.pause(); deathAudio.currentTime = 0;
  }
  function playJumpSound(){
    ensureAudioCtx();
    if (!jumpBuffer){ jumpAudio.currentTime = 0; jumpAudio.play().catch(function(){}); return; }
    var src = audioCtx.createBufferSource();
    src.buffer = jumpBuffer;
    src.connect(audioCtx.destination);
    src.start(0);
    currentJumpSrc = src;
  }
  function playDeathSound(){
    ensureAudioCtx();
    if (!deathBuffer){ deathAudio.currentTime = 0; deathAudio.play().catch(function(){}); return; }
    var src = audioCtx.createBufferSource();
    src.buffer = deathBuffer;
    src.connect(audioCtx.destination);
    src.start(0);
    currentDeathSrc = src;
  }

    try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
  }

  function reset(){
    stopAllSounds();
    state = 'playing';
    score = 0; elapsed = 0;
    obstacles = []; spawnTimer = 0;
    lastLevelSeen = 0; levelUpTimer = 0;
    chicken.y = groundY; chicken.vy = 0; chicken.jumping = false; chicken.jumpsUsed = 0;
    document.getElementById('overlay').style.display = 'none';
  }

  var fullscreenTried = false;
  function tryFullscreen(){
    if(fullscreenTried) return;
    fullscreenTried = true;
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req){ try{ req.call(el); }catch(e){} }
  }

  var JUMP_INPUT_DEBOUNCE = 120; // ms — 터치/마우스 합성 이벤트 중복 호출 방지

  function jump(){
    if(!spriteReady) return;
    var now = Date.now();
    if(now - lastJumpInputTime < JUMP_INPUT_DEBOUNCE) return;
    lastJumpInputTime = now;

    tryFullscreen();
    if(state === 'ready' || state === 'over'){ reset(); return; }
    if(state === 'playing' && chicken.jumpsUsed < MAX_JUMPS){
      chicken.vy = chicken.jumpsUsed === 0 ? JUMP_V : JUMP_V2;
      chicken.jumping = true;
      chicken.jumpsUsed += 1;
      playJumpSound();
    }
  }

  frame.addEventListener('touchstart', function(e){ e.preventDefault(); jump(); }, { passive: false });

  document.addEventListener('keydown', function(e){ if(e.code === 'Space'){ e.preventDefault(); jump(); } });

  var LEVEL_DURATION = 400; // 약 6.7초마다 한 단계씩 (기존 8초 → 앞당김, 레벨이 올라갈수록 체감 폭이 더 커짐)

  function currentLevel(){
    return Math.floor(elapsed / LEVEL_DURATION);
  }

  function currentSpeed(){
    var level = Math.min(currentLevel(), 10); // 최대 10단계까지
    return walkSpeed + level * 1.05; // 더블점프로 쉬워진 난이도를 보정하기 위해 증가폭 상향 (0.85 → 1.05)
  }

  function drawBackground(speed){

    buildOffsetNear -= Math.max(speed*0.35, 0.5);

        }
      }
    });

    ctx.strokeStyle = lerpColor(DAY.ground, NIGHT.ground, night); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, groundY + 8); ctx.lineTo(LOGICAL_W, groundY + 8); ctx.stroke();

    return night;
  }

  function drawChicken(night){
    if(!spriteReady) return;
    var gx = chicken.x, gy = chicken.y;

    if(!chicken.jumping){
      // 러닝: 보드가 이미 그림에 포함됨. 푸시킥 동작(밀었다가 회복하는 리듬)을 흉내
      var period = 42;
      var phase = elapsed % period;
      var lean, bounce;
      if(phase < 14){
        lean = (phase / 14) * 5;       // 미는 동작: 앞으로 기울임
        bounce = (phase / 14) * 1.6;
      } else {
        var t = (phase - 14) / (period - 14);
        lean = 5 * (1 - t);            // 회복: 원위치로
        bounce = 1.6 * (1 - t);
      }
      ctx.save();
      ctx.translate(gx, gy - bounce);
      ctx.rotate(lean * Math.PI / 180);
      ctx.drawImage(spriteRun, -SPR_RUN_W/2, -SPR_RUN_H + 4, SPR_RUN_W, SPR_RUN_H);
      ctx.restore();
    } else {
      // 점프: 서 있는 이미지 + 코드로 그린 보드(왼쪽 이미지와 같은 톤)
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(-6 * Math.PI / 180);
      ctx.scale(1, 1.06);
      ctx.drawImage(spriteJump, -SPR_JUMP_W/2, -SPR_JUMP_H + 4, SPR_JUMP_W, SPR_JUMP_H);
      ctx.restore();

      var boardY = gy + 1;
      ctx.drawImage(boardImg, gx - BOARD_W/2, boardY, BOARD_W, BOARD_H);
    }
  }

  var OBSTACLE_TYPES = ['cat', 'dog', 'cone', 'bin', 'trashbag', 'hydrant', 'pigeon'];
  var OBS_ASPECT = { cat: 31/40, dog: 39/40, cone: 58/70, bin: 74/78, trashbag: 56/68, hydrant: 35/60, pigeon: 115/60 };
  // 줄무늬 튜브(파이프) 하나를 그리는 헬퍼 - 검정/노랑 번갈아가며 세그먼트로 채움
  function drawStripedTube(x1, y1, x2, y2, thickness, stripeLen, c1, c2){
    c1 = c1 || '#1F1B17'; c2 = c2 || '#F2C200';
    var dx = x2 - x1, dy = y2 - y1;
    var length = Math.sqrt(dx*dx + dy*dy);
    if(length < 1) return;
    var ux = dx/length, uy = dy/length;
    var n = Math.max(Math.floor(length / stripeLen), 1);
    ctx.lineCap = 'butt';
    for(var i = 0; i <= n; i++){
      var t0 = i * stripeLen;
      if(t0 >= length) break;
      var t1 = Math.min((i+1) * stripeLen, length);
      ctx.strokeStyle = (i % 2 === 0) ? c1 : c2;
      ctx.lineWidth = thickness;
      ctx.beginPath();
      ctx.moveTo(x1 + ux*t0, y1 + uy*t0);
      ctx.lineTo(x1 + ux*t1, y1 + uy*t1);
      ctx.stroke();
    }
    // 세그먼트 이음새를 둥글게 메워서 자연스럽게 연결
    for(var i = 0; i <= n; i++){
      var t = Math.min(i * stripeLen, length);
      var jx = x1 + ux*t, jy = y1 + uy*t;
      ctx.fillStyle = (i % 2 === 0) ? c1 : c2;
      ctx.beginPath();
      ctx.arc(jx, jy, thickness/2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawBarricade(o){
    var top = groundY - o.h + 4;
    var thick = Math.max(o.h * 0.11, 3);
    var wheelR = o.h * 0.06;
    var topY = top + thick * 0.5;
    var bottomY = top + o.h - wheelR * 1.8;
    var leftX = o.x + thick * 0.5;
    var rightX = o.x + o.w - thick * 0.5;
    var stripeLen = thick * 1.15;

    var numPosts = 4;
    var postXs = [];
    for(var i = 0; i < numPosts; i++) postXs.push(leftX + (rightX - leftX) * i / (numPosts - 1));

    // X자 브레이싱 (뒤쪽에 먼저 그려서 기둥/레일이 위로 겹치게)
    for(var i = 0; i < numPosts - 1; i++){
      var xA = postXs[i], xB = postXs[i+1];
      drawStripedTube(xA, topY, xB, bottomY, thick*0.62, stripeLen*0.9);
      drawStripedTube(xA, bottomY, xB, topY, thick*0.62, stripeLen*0.9);
    }
    // 세로 기둥
    for(var i = 0; i < numPosts; i++){
      drawStripedTube(postXs[i], topY, postXs[i], bottomY, thick*0.88, stripeLen);
    }
    // 위/아래 가로 레일
    drawStripedTube(leftX, topY, rightX, topY, thick, stripeLen);
    drawStripedTube(leftX, bottomY, rightX, bottomY, thick, stripeLen);

    // 바닥 캐스터 바퀴
    [leftX, rightX].forEach(function(wx){
      var wy = bottomY + thick * 0.45;
      ctx.fillStyle = '#2d2d2d';
      ctx.beginPath();
      ctx.ellipse(wx, wy + wheelR*0.8, wheelR*1.1, wheelR*0.8, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#961e1e';
      ctx.beginPath();
      ctx.ellipse(wx, wy + wheelR*0.9, wheelR*0.45, wheelR*0.45, 0, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function drawSpikeStrip(o){
    var top = groundY - o.h + 4;
    var baseH = o.h * 0.34;
    var baseTop = groundY - baseH + 4;
    // 노랑/검정 대각선 줄무늬 바닥판
    ctx.save();
    ctx.beginPath();
    ctx.rect(o.x, baseTop, o.w, baseH);
    ctx.clip();
    var stripeW = 10;
    ctx.fillStyle = '#F2C200';
    ctx.fillRect(o.x, baseTop, o.w, baseH);
    ctx.fillStyle = '#1F1B17';
    for(var sx = o.x - baseH; sx < o.x + o.w + baseH; sx += stripeW*2){
      ctx.beginPath();
      ctx.moveTo(sx, baseTop + baseH);
      ctx.lineTo(sx + baseH, baseTop);
      ctx.lineTo(sx + baseH + stripeW, baseTop);
      ctx.lineTo(sx + stripeW, baseTop + baseH);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = '#1F1B17';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(o.x, baseTop, o.w, baseH);
    // 뾰족하고 굵은 스파이크들 (개수는 줄이고 두께는 키움)
    var spikeCount = Math.max(Math.round(o.w / 26), 3);
    var spikeBaseW = (o.w / spikeCount) * 0.22;
    ctx.fillStyle = '#2A2A2A';
    for(var i = 0; i < spikeCount; i++){
      var sxp = o.x + (o.w / spikeCount) * (i + 0.5);
      ctx.beginPath();
      ctx.moveTo(sxp - spikeBaseW, baseTop);
      ctx.lineTo(sxp, top);
      ctx.lineTo(sxp + spikeBaseW, baseTop);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawObstacle(o){
    var top = groundY - o.h + 4;
    if(o.wide){
      ctx.save();
      ctx.shadowColor = '#D97757';
      ctx.shadowBlur = 6;
      if(o.type === 'barricade') drawBarricade(o); else drawSpikeStrip(o);
      ctx.restore();
      return;
    }
    ctx.drawImage(obsImgs[o.type], o.x, top, o.w, o.h);
  }

  function loop(){
    requestAnimationFrame(loop);
    var speed = currentSpeed();
    var night = drawBackground(speed);

    if(state === 'playing' && spriteReady){
      elapsed += 1;
      score = Math.floor(elapsed / 6);

      var levelNow = Math.min(currentLevel(), 10);
      if(levelNow > lastLevelSeen){
        lastLevelSeen = levelNow;
        levelUpTimer = 45; // 약 0.75초간 이펙트 표시
      }
      if(levelUpTimer > 0) levelUpTimer -= 1;

      chicken.vy += GRAV;
      chicken.y += chicken.vy;
      if(chicken.y > groundY){ chicken.y = groundY; chicken.vy = 0; chicken.jumping = false; chicken.jumpsUsed = 0; }

      spawnTimer -= 1;
      if(spawnTimer <= 0){
        var lvl = Math.min(currentLevel(), 10);

        // 레벨 6(내부 인덱스 5)부터 25% 확률로 폭 넓은 바리케이드/스파이크 스트립 스폰 (더블점프 필요)
        var spawnWide = lvl >= 5 && Math.random() < 0.25;

        if(spawnWide){
          var singleJumpRangePx = (2 * Math.abs(JUMP_V) / GRAV) * speed; // 한 번 점프의 최대 커버 거리
          var wideType = Math.random() < 0.5 ? 'barricade' : 'spikestrip';
          var wideW, wideH;
          if(wideType === 'barricade'){
            wideW = singleJumpRangePx * (0.38 + Math.random()*0.08); // 최대 점프거리 기준 38~46%
            wideH = 44 + Math.random()*4;
          } else {
            wideW = singleJumpRangePx * (0.55 + Math.random()*0.1); // 스파이크스트립은 낮고 길게: 55~65%
            wideH = 16 + Math.random()*3;
          }
          obstacles.push({ x: LOGICAL_W + 10, w: wideW, h: wideH, type: wideType, wide: true });
          var minFrames = lvl < 5 ? 45 : Math.max(45 - (lvl-4)*7, 14);
          spawnTimer = Math.max(90 * (0.8 + Math.random()*0.4), minFrames + 30); // 다음 장애물까지 여유를 좀 더 둠
        } else {
          var type = OBSTACLE_TYPES[Math.floor(Math.random()*OBSTACLE_TYPES.length)];
          var h;
          if(type === 'pigeon'){ h = 20 + Math.random()*2; }
          else if(type === 'cat' || type === 'dog'){ h = 28 + Math.random()*4; }
          else if(type === 'bin'){ h = 35 + Math.random()*4; }
          else { h = 33 + Math.random()*7; } // cone, trashbag, hydrant
          var w = h * OBS_ASPECT[type];
          obstacles.push({ x: LOGICAL_W + 10, w: w, h: h, type: type });

          var minFrames = lvl < 5 ? 45 : Math.max(45 - (lvl-4)*7, 14); // 레벨 5부터 최소값이 줄어들어 9~10에서 거의 연속 점프 수준
          var speedRatio = walkSpeed / speed;
          var baseFrames = Math.max(78 * Math.pow(speedRatio, 1.4), minFrames + 2); // 속도가 오를수록 빈도가 비례 이상으로 가파르게 증가
          var raw = baseFrames * (0.65 + Math.random()*0.6); // 불규칙한 편차
          spawnTimer = Math.max(raw, minFrames);
        }
      }
      for(var i = obstacles.length - 1; i >= 0; i--){
        obstacles[i].x -= speed;
        if(obstacles[i].x + obstacles[i].w < -5) obstacles.splice(i, 1);
        else {
          var o = obstacles[i];
          var curW = chicken.jumping ? SPR_JUMP_W : SPR_RUN_W;
          var cLeft = chicken.x - curW/2 + 8, cRight = chicken.x + curW/2 - 8, cBottom = chicken.y;
          var oTop = groundY - o.h + 4;
          if(cRight > o.x && cLeft < o.x + o.w && cBottom > oTop){
            state = 'over';
            playDeathSound();
            vibrate([40, 30, 60]);
            if(score > best){ best = score; try{ localStorage.setItem('chicken_flip_best_score', String(best)); }catch(e){} }
            var ov = document.getElementById('overlay');
            ov.innerHTML = '<div style="font-size:20px; font-weight:500; color:#1F1B17; background:rgba(244,241,236,0.85); padding:4px 14px; border-radius:8px;">score ' + score + '</div><div style="font-size:13px; color:#6b6560; margin-top:6px; background:rgba(244,241,236,0.85); padding:2px 10px; border-radius:6px;">best ' + best + '</div><div style="font-size:13px; color:#B8543A; margin-top:10px; background:rgba(244,241,236,0.85); padding:2px 10px; border-radius:6px;">tap to retry</div>';
            ov.style.display = 'flex';
          }
        }
      }
    }

    obstacles.forEach(drawObstacle);
    drawChicken(night);

    if(state === 'playing'){
      ctx.fillStyle = night > 0.5 ? '#F4F1EC' : '#1F1B17';
      ctx.font = '13px sans-serif';
      ctx.fillText('score ' + score, LOGICAL_W - 70, 20);
      ctx.font = '11px sans-serif';
      ctx.globalAlpha = 0.7;
      ctx.fillText('best ' + best, LOGICAL_W - 70, 33);
      ctx.globalAlpha = 1;
      ctx.font = '12px sans-serif';
      var lvDisplay = (currentLevel() + 1 >= 10) ? 'MAX' : (currentLevel() + 1);
      ctx.fillText('LV ' + lvDisplay, LOGICAL_W - 70, 49);

      if(levelUpTimer > 0){
        var t = levelUpTimer / 45; // 1 -> 0
        // 화면 가장자리 오렌지 플래시
        ctx.save();
        ctx.globalAlpha = Math.max(t * 0.35, 0);
        ctx.strokeStyle = '#D97757';
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, LOGICAL_W, LOGICAL_H);
        ctx.restore();

        // 가운데 "LEVEL UP" 텍스트, 위로 떠오르며 페이드아웃
        ctx.save();
        var riseY = 62 - (1 - t) * 16;
        ctx.globalAlpha = Math.min(t * 1.6, 1);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#D97757';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('LEVEL ' + (lastLevelSeen + 1 >= 10 ? 'MAX' : lastLevelSeen + 1), LOGICAL_W/2, riseY);
        ctx.textAlign = 'left';
        ctx.restore();
      }
    }
  }
  loop();
}catch(err){
  var ov = document.getElementById('overlay');
  if(ov){ ov.innerHTML = '<div style="font-size:12px; color:#B8543A; text-align:center; padding:0 16px;">오류: ' + (err && err.message ? err.message : err) + '</div>'; }
}
})();
</script>
